<script>

// Make sure user data is loaded and displayed
document.addEventListener('DOMContentLoaded', function() {
  // User session is already included in the page by includeUserData()
  const userData = <?!= includeUserData(); ?>;
  
  // Check if user data exists and user elements exist
  if (userData) {
    // Get the user info elements
    const userNameElement = document.getElementById('userName');
    const userRoleElement = document.getElementById('userRole');
    const userAvatarElement = document.getElementById('userAvatar');
    
    // Update user info if elements exist
    if (userNameElement) userNameElement.textContent = userData.name;
    if (userRoleElement) userRoleElement.textContent = userData.role;
    if (userAvatarElement) userAvatarElement.textContent = userData.name.charAt(0).toUpperCase();
  }
});

window.onload = function() {
  // Get user session data
  const userData = <?!= includeUserData(); ?>;
  
  if (userData) {
    // Display user info
    const userNameElement = document.getElementById('userName');
    const userRoleElement = document.getElementById('userRole');
    const userAvatarElement = document.getElementById('userAvatar');
    
    if (userNameElement && userRoleElement && userAvatarElement) {
      userNameElement.textContent = userData.name;
      userRoleElement.textContent = userData.role;
      
      // Set avatar initial
      const initialLetter = userData.name.charAt(0).toUpperCase();
      userAvatarElement.textContent = initialLetter;
    } else {
      console.error('User info elements not found in DOM');
    }
    
    // Load data
    loadData();
  } else {
    // Redirect to login if no valid session
    window.location.href = '<?= ScriptApp.getService().getUrl(); ?>?page=logout';
  }
};
      
      // Define loadData function for your existing functionality
      function loadData() {
        google.script.run
          .withSuccessHandler(initializeData)
          .withFailureHandler(showError)
          .getVendorManagement();
          
      }

function displayData(data) {
  const tableBody = document.getElementById('tableBody');
  const loadingDiv = document.getElementById('loading');
  const table = document.getElementById('vendorManagementTable');
  
  tableBody.innerHTML = '';
  
  data.forEach(row => {
    const tr = document.createElement('tr');
    
    row.forEach(cell => {
      const td = document.createElement('td');
      td.textContent = cell;
      tr.appendChild(td);
    });
    
    tableBody.appendChild(tr);
  });
  
  loadingDiv.style.display = 'none';
  table.style.display = 'table';
}

function showError(error) {
  const loadingDiv = document.getElementById('loading');
  loadingDiv.innerHTML = 'Error loading data: ' + error;
  loadingDiv.style.color = 'red';
}
